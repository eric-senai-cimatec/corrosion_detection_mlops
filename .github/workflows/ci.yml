name: MLOps Automation - Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv execution engine
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true

    - name: Install project dependencies using uv
      run: |
        uv pip install --system -U apache-airflow werkzeug opencv-python-headless labelme pytest mlflow ultralytics

    - name: Execute Test Suite via Pytest
      run: |
        pytest -v
