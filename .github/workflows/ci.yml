name: MLOps Automation - Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv execution engine
      run: curl -LsSf https://astral.sh | sh

    - name: Install project dependencies using uv
      run: |
        uv venv
        . .venv/bin/activate
        uv pip install -U apache-airflow werkzeug opencv-python-headless labelme pytest mlflow ultralytics

    - name: Execute Test Suite via Pytest
      run: |
        . .venv/bin/activate
        pytest -v
